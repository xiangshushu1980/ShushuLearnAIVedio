夜晚的街道，路灯把两人的影子拉得很长。Yuki 在画面左侧，双手背在身后，歪头笑着看向 Alya；Alya 在画面右侧，停下脚步转身面对 Yuki（与天台、海边段屏幕方向一致：Yuki 左/Alya 右）。

Yuki 俏皮地说明天见，Alya 温柔地点头微笑目送 Yuki 转身跑远，风轻轻吹起两人的发丝，路灯下影子渐渐分开。
