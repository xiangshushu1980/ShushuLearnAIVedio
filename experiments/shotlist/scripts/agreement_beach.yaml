黄昏的海边，海浪轻轻拍打沙滩。Alya 在画面左侧望向海平线，Yuki 在画面右侧张开双臂迎着海风。

Alya 轻声感叹海面的景色，Yuki 笑着大声回应要一起看遍每一片海，两人相视而笑，夕阳把影子拉得很长。
