放学路上，Alya 和 Yuki 并肩走过操场边的铁网围栏，远处的操场上正在举行球赛，背景里有多名学生大声喊叫。两人一边走一边聊天，背景喊声持续。

Alya（边走边说）：听说了吗，下午决赛是三年级对二年级。

背景操场（多人齐喊，远处）：传球！快传球！

Yuki（点点头）：嗯嗯，听说三年级那个王牌超厉害的。

背景操场（多人欢呼，远处）：好球！漂亮！

Alya（眼睛一亮）：那放学我们也去看吧。

Yuki（跳起来）：好呀好呀！

背景操场（多人急喊，远处）：防守！注意防守！
