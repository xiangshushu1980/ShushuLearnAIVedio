放学后的走廊，Alya 和 Yuki 面对面站着，Alya 正兴奋地想讲昨天比赛的经过，Yuki 总是抢在她前面。

Alya（刚开口，兴致勃勃）：我跟你讲，昨天的比赛——

Yuki（打断她，语速飞快）：我知道我知道！那个三分球超帅的！

Alya（又被打断，有点急）：你听我说完嘛！根本不是——

Yuki（同时开口，两人声音叠在一起）：明明就是——

Yuki（停下来让步，笑嘻嘻）：好吧好吧，你说你说。

Alya（得意地笑）：这还差不多～
