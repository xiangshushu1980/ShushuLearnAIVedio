黄昏的校园天台，晚霞染红半边天。Alya 和 Yuki 两姐妹并肩靠在栏杆上，Yuki 双手背在身后。

（旁白，画外音）这一年的夏天，似乎比往常更安静了一些。

Alya（语气平淡，带着关心）：喂，Yuki，你真的决定要去那边了吗？

Alya（顿了顿，语气变得俏皮）：我可是听说了哦，那边可没有你最爱的那家可丽饼店。

Yuki（歪头坏笑，声音轻快）：哼哼，姐姐是在担心我吗？放心啦，我会把那边好吃的都打包带回来的。
