教室课桌边，Alya、Yuki 和男同学甲（戴眼镜、穿白衬衫，一次性路人角色）三人围坐讨论明天的社团活动。

同学甲（推了推眼镜，认真地问）：明天的社团活动，你们都去吗？

Alya 和 Yuki（同时大声回答，声音重叠）：去！当然去！

同学甲（看向 Yuki，笑着追问）：那 Yuki，你这次不会又迟到吧？

Alya（抢先替妹妹打包票）和同学甲（半开玩笑质疑）同时开口，声音叠在一起：她肯定准时到！／难说哦～

Yuki（鼓着脸，不满地）：
喂！你们两个！
