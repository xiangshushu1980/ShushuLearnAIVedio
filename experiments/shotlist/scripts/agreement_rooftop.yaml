黄昏的校园天台，晚霞把天空染成橘红色。Yuki 在画面左侧，双手背在身后歪头看向 Alya；Alya 在画面右侧靠在栏杆上。

Yuki 俏皮地开口问 Alya 明天的约定，Alya 微微低头露出温柔的笑容轻声回应，风吹起两人的发丝。
