黄昏的校门口，Alya 和 Yuki 两姐妹并肩站着，同时望向画面右侧的马路方向——第三个人（画外）约好了来接她们，她们在等他。

（旁白，画外音）那天放学后，她们在校门口等了很久。

Alya（对画外右侧的第三人喊，语气期待）：喂——，我们在这儿！

Yuki（笑着看 Alya，语气俏皮）：姐姐，你喊那么大声，他肯定早就听到啦。
