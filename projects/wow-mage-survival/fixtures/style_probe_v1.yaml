fixed_world_block: >-
  World of Warcraft Classic-inspired in-game fantasy visual language, stylized 3D
  character proportions, chunky readable silhouettes, hand-painted game textures,
  saturated but weathered colors, clear Warcraft-like faction shapes and equipment,
  high-quality fitted clothing even for farmers and villagers, dyed wool, leather
  trim, metal fittings, blue-and-gold human heraldic accents, believable game-world
  scale, readable action staging, frontier wear belongs mainly to the environment,
  no photorealistic medieval drama, no generic peasant rags, no modern objects,
  no text or logo

cases:
  - id: SP01_MONASTERY_ORDINARY
    seed: 37101
    intent: "确认普通人气质、世界观和画面层次"
    prompt: >-
      an ordinary young adult man with an average face, wearing well-made practical
      human traveler clothing with a fitted wool tunic, leather belt, neat boots and
      subtle blue trim, standing uncertainly outside Northshire Abbey at dawn,
      well-dressed villagers and blue-and-gold Stormwind-style guards continuing their
      routine around him, he looks alert but inexperienced,
      {fixed_world_block}
  - id: SP02_WOLF_FIRST_THREAT
    seed: 37102
    intent: "确认低等级真实危险，而不是英雄海报"
    prompt: >-
      the ordinary young man in well-made but non-heroic human travel clothes backing
      away from a rapidly approaching grey wolf near
      the Northshire Abbey road, uneven ground, loose stones and tall grass affecting footing,
      fear and calculation visible in the pose, the wolf is close enough to be dangerous,
      {fixed_world_block}
  - id: SP03_FIRE_SHAPING
    seed: 37103
    intent: "确认火焰可以成为可控形态和空间工具"
    prompt: >-
      the same ordinary young man shaping a thin curved ribbon of fire between his hands,
      using it as a short-lived barrier rather than a giant fireball, heat distortion,
      smoke and nearby dry grass reacting with clear cause and effect, cautious imperfect
      control, {fixed_world_block}
  - id: SP04_ICE_SHAPING
    seed: 37104
    intent: "确认冰霜的结构、重量、摩擦和脆裂感"
    prompt: >-
      the same ordinary young man forming a low wedge of translucent ice on the muddy
      road, one boot braced against it, frost spreading across wet ground and small cracks
      showing structural stress, the magic is practical and unstable, {fixed_world_block}
  - id: SP05_ENVIRONMENT_TRICK
    seed: 37105
    intent: "确认斗智斗勇和四两拨千斤的画面表达"
    prompt: >-
      the ordinary young man luring a wolf toward a narrow muddy slope, a small sheet of
      ice removes the wolf's footing while a controlled flame ignites a fallen branch to
      block the escape route, the tactic is legible in one frame, no oversized spell,
      {fixed_world_block}
  - id: SP06_ESCAPE
    seed: 37106
    intent: "确认移动、空间位置和真实逃生感"
    prompt: >-
      the exhausted ordinary young man escaping through a broken wooden fence beside
      the monastery, a small ice foothold and a brief fire flash create just enough space
      to survive, wolf silhouettes behind him, debris, breath and dirt communicate effort,
      {fixed_world_block}
  - id: SP07_STORMWIND_GATE
    seed: 37107
    intent: "确认暴风城人类联盟建筑、守卫装备和城市尺度"
    prompt: >-
      an ordinary young human traveler arriving beneath the massive gates of Stormwind,
      pale limestone walls, blue rooftops, blue-and-gold Alliance banners, human guards
      in recognizable blue plate and tabards, busy market street beyond the bridge,
      he feels small and overwhelmed rather than heroic, {fixed_world_block}
  - id: SP08_WESTFALL_FRONTIER
    seed: 37108
    intent: "确认西部荒野的边境、农场和战争后的荒凉感"
    prompt: >-
      the ordinary young human traveler crossing a Westfall frontier road, windmill,
      abandoned farm buildings, broken fences, dry yellow grass, distant watchtower,
      battered but well-made human clothing, broad empty sky and a dangerous borderland
      atmosphere, no heroic pose, {fixed_world_block}
  - id: SP09_DEADMINES_ENTRANCE
    seed: 37109
    intent: "确认死亡矿井的矿洞工业、木梁、矿轨和火把"
    prompt: >-
      the ordinary young human traveler hiding at the entrance to the Deadmines,
      rough mine tunnel, heavy timber supports, iron rails, wooden platforms, crates,
      ropes, torchlight, damp rock and a distant goblin-built machine, he studies patrol
      routes before entering, readable stealth and danger, {fixed_world_block}
  - id: SP10_DEFIAS_BANDITS
    seed: 37110
    intent: "确认迪菲亚兄弟会的红面巾、皮革、轻型护具和组队巡逻"
    prompt: >-
      three Defias Brotherhood bandits patrolling a ruined Westfall road, red cloth masks,
      dark leather armor, short blades and crossbows, coordinated silhouettes near a
      broken farm gate, the ordinary young human traveler concealed behind a stone wall,
      planning an escape route instead of fighting directly, {fixed_world_block}

scoring:
  scale: "1-5; 1=失败, 3=可用, 5=明显优势"
  dimensions:
    - ordinary_protagonist
    - spell_shape_readability
    - spatial_cause_and_effect
    - fire_ice_material_response
    - tactical_action_readability
    - environment_consistency
    - likely_h3_reference_compatibility
  gate: "候选必须在 SP03-SP06 的法术/策略项达到可用，不能只凭 SP01 的漂亮程度胜出"
