<header><h1>ComfyUI → DLSS5 视频增强</h1><span id="root">扫描中…</span><span id="count"></span><button class="library-toggle" title="收起或展开左侧视频资料库" onclick="toggleLibrary()">收起资料库</button></header>
<main><aside><div class="bar"><button title="重新扫描 WSL ComfyUI output/video 目录" onclick="refresh()">⟳ 刷新视频</button><button title="保存当前目录和处理参数" onclick="saveConfig()">✓ 保存配置</button><button title="在资源管理器中打开 ComfyUI 视频目录" onclick="openFolder('video')">📂 视频目录</button><button title="在资源管理器中打开 DLSS5 增强结果目录" onclick="openFolder('output')">📂 输出目录</button><button title="在资源管理器中打开 video2dlssnr 引擎目录" onclick="openFolder('engine')">📂 引擎目录</button></div><div id="grid" class="grid"></div></aside>

<div class="panel"><div class="fields"><label title="ComfyUI 生成视频的根目录。程序会递归读取其中的 mp4、mov、mkv、webm、avi、m4v 文件；默认是 WSL 中的 ComfyUI/output/video。">视频目录<input id="video_dir" placeholder="例如 \\wsl$\udev\home\sean\projects\ComfyUI\output\video"></label><label title="video2dlssnr 项目根目录，必须是里面直接存在 nr_video.py 的文件夹。示例：D:\\dlss5\\video2dlssnr。不是 DLL 所在目录，也不是 ComfyUI 目录。当前为空表示尚未安装或配置引擎。">引擎目录<input id="engine_root" oninput="updateEngineHelp()" placeholder="例如 D:\\dlss5\\video2dlssnr"></label><label title="运行 nr_video.py 的 Windows Python。优先填写引擎自带的 .venv\\Scripts\\python.exe；若引擎没有专用环境，可填写系统 python.exe。Python 必须能导入引擎依赖。">引擎 Python<input id="engine_python" oninput="updateEngineHelp()" placeholder="例如 D:\\dlss5\\video2dlssnr\\.venv\\Scripts\\python.exe"></label><label title="增强视频输出目录。原视频不会被覆盖；程序会按原视频的子目录结构保存，并在文件名后追加 .dlss5。">输出目录<input id="output_dir" placeholder="例如 C:\\Users\\xiang\\Videos\\DLSS5-enhanced"></label><label title="增强风格。Default 使用基础风格；Natural 更适合人物、数字人和写实素材，通常伪影较少；Cinematic 更强调电影感和局部观感，可能更容易改变原始细节。">风格<select id="style"><option value="0">Default</option><option value="1">Natural</option><option value="2">Cinematic</option></select></label><label title="引擎内部预设档位 0–3。数字越高通常越偏向更强或更慢的处理，但具体行为取决于当前 video2dlssnr 版本。建议先使用 0，再逐档比较。">Preset<select id="preset"><option>0</option><option>1</option><option>2</option><option>3</option></select></label><label title="输出放大倍数。1× 保持原分辨率，适合先判断增强是否改变脸和口型；1.5×/2× 会提高分辨率、显存和处理时间；3× 只建议在短片上测试。">放大倍数<select id="scale"><option>1</option><option>1.5</option><option>2</option><option>3</option></select></label><label title="整体 Neural Rendering 影响强度，范围 0–2。越高增强越明显，也越可能改变人物身份、嘴型、纹理或产生闪烁。推荐先从 0.7 开始。">强度<input id="intensity" type="number" step="0.1" min="0" max="2"></label><label title="细节恢复强度，范围 0–2。越高越锐利，但压缩噪声、头发边缘和背景纹理也可能被放大。人物视频建议从 0.7 开始。">细节<input id="detail" type="number" step="0.1" min="0" max="2"></label><label title="输出编码器。hevc_nvenc 体积和质量平衡较好；av1_nvenc 压缩率高但兼容性较弱；h264_nvenc 兼容性最好；prores/ffv1 更适合中间文件，体积会很大。NVENC 选项需要 NVIDIA 驱动支持。">编码<select id="codec"><option>hevc_nvenc</option><option>av1_nvenc</option><option>h264_nvenc</option><option>prores</option><option>ffv1</option></select></label><label title="编码质量参数（Constant Quality）。通常数值越小质量越高、文件越大；数值越大压缩越强。NVENC 常用 15–25，默认 19；它不是增强强度。">CQ<input id="cq" type="number" min="0" max="51"></label><label title="输出位深。10-bit 能更好保留渐变和 HDR 素材，但文件与编码要求更高；普通 SDR 素材或兼容性优先时可选 8-bit。">位深<select id="bit_depth"><option>8</option><option>10</option></select></label></div><div id="engineHelp" class="engine-help"></div>
<div class="actions"><button id="processBtn" title="按当前参数开始处理；处理中会变成停止处理" onclick="toggleProcess()"><span class="morph-icon">✦</span> 开始处理</button></div><div id="status" class="status">就绪</div><div class="progress-wrap"><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><span id="progressText">未开始</span></div><p class="hint">对比模式中拖动中间分割线即可查看差异。服务只在处理时占用 GPU。</p></div></div></section></main>
<script>
let videos=[],selected=null,config={},saveTimer=null;const $=id=>document.getElementById(id),fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(0)+' KB';
async function api(url,opts={}){const r=await fetch(url,opts),x=await r.json();if(!r.ok)throw Error(x.error||r.statusText);return x}
async function refresh(){try{const x=await api('/api/videos');videos=x.videos;$('root').textContent=x.root;$('count').textContent=`${videos.length} 个视频（含子目录）`;render();if(selected){const v=videos.find(v=>v.path===selected.path);if(v)select(v)}}catch(e){$('count').textContent='读取失败: '+e.message}}
function browserThumb(img,encodedUrl){if(img.dataset.fallback)return;img.dataset.fallback='1';const v=document.createElement('video');v.muted=true;v.preload='metadata';v.src=decodeURIComponent(encodedUrl);v.addEventListener('loadedmetadata',()=>{v.currentTime=Math.min(.1,v.duration||0)});v.addEventListener('seeked',()=>{const canvas=document.createElement('canvas'),ratio=v.videoWidth/v.videoHeight||16/9;canvas.width=360;canvas.height=Math.round(canvas.width/ratio);canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);img.src=canvas.toDataURL('image/jpeg',.82);v.remove()},{once:true});v.addEventListener('error',()=>{img.style.opacity=.25;v.remove()},{once:true})}
function render(){const grid=$('grid');grid.innerHTML='';if(!videos.length){grid.innerHTML='<div class="empty">目录中没有视频，或目录不可用</div>';return}videos.forEach(v=>{const c=document.createElement('div');c.className='card'+(selected&&selected.path===v.path?' selected':'');c.innerHTML=`<img loading="lazy" src="/thumb?path=${encodeURIComponent(v.path)}" data-video="${encodeURIComponent(v.url)}" onerror="browserThumb(this,this.dataset.video)"><div class="name" title="${v.path}">${v.name}</div><div class="meta">${fmt(v.size)} · ${new Date(v.mtime*1000).toLocaleString()}</div>`;c.onclick=()=>select(v);grid.appendChild(c)})}
function setInput(id,v){$(id).value=v??''}function updateEngineHelp(){const root=$('engine_root').value.trim(),python=$('engine_python').value.trim(),box=$('engineHelp');if(!root){box.className='engine-help missing';box.textContent='引擎未配置：请安装或下载 video2dlssnr，然后填写其根目录（该目录内必须直接有 nr_video.py）。只浏览/预览不需要引擎，点击“开始处理”时才需要。';return}box.className='engine-help';box.textContent='引擎目录：'+root+'；处理入口：'+root.replace(/[\\/]$/,'')+'\\nr_video.py'+(python?'；Python：'+python:'；未指定 Python，将使用当前 Python。');}
function select(v){selected=v;$('empty').hidden=true;$('detail').hidden=false;$('title').textContent=v.name;$('path').textContent=v.path;$('singlePlayer').hidden=false;$('singlePlayer').src=v.url;$('player').pause();$('resultPlayer').pause();$('player').src=v.url;$('compare').hidden=true;$('compareTools').hidden=true;$('playbackTools').hidden=true;$('resultPlayer').removeAttribute('src');render();loadResult()}
async function loadResult(){if(!selected)return;try{const x=await api('/api/result?path='+encodeURIComponent(selected.path));if(x.exists){$('singlePlayer').pause();$('singlePlayer').hidden=true;$('compare').hidden=false;$('compareTools').hidden=false;$('playbackTools').hidden=false;$('resultPlayer').src=x.url;$('resultHint').textContent='增强结果已加载';setCompare($('compareRange').value);updatePlayback()}else{$('resultHint').textContent='尚无增强结果'}}catch(e){$('resultHint').textContent='结果读取失败：'+e.message}}
function setCompare(value){const n=Math.max(5,Math.min(95,Number(value)));$('compareRange').value=n;$('resultPane').style.setProperty('--split',n+'%');$('divider').style.left=n+'%'}
function dragCompare(e){const rect=$('compare').getBoundingClientRect();setCompare((e.clientX-rect.left)/rect.width*100)}
function syncCompare(){const source=$('player'),result=$('resultPlayer');if(result.src&&Number.isFinite(source.currentTime))try{result.currentTime=source.currentTime;result.playbackRate=1}catch(e){}}
function followCompare(){const source=$('player'),result=$('resultPlayer');if(!result.src||source.paused||result.paused)return;const drift=source.currentTime-result.currentTime;if(Math.abs(drift)>.35){syncCompare();return}result.playbackRate=Math.max(.97,Math.min(1.03,1+drift*.12))}
function fmtTime(s){s=Number.isFinite(s)?Math.max(0,s):0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}
function bothReady(){return $('player').readyState>=3&&$('resultPlayer').readyState>=3}
function waitCanPlay(v){return v.readyState>=3?Promise.resolve():new Promise(resolve=>{const done=()=>{v.removeEventListener('canplay',done);resolve()};v.addEventListener('canplay',done)})}
function bufferedAhead(v,t){for(let i=0;i<v.buffered.length;i++)if(v.buffered.start(i)<=t+0.05&&v.buffered.end(i)>=t)return v.buffered.end(i)-t;return 0}
function waitBuffered(v,t,minAhead=.35){if(bufferedAhead(v,t)>=minAhead&&v.readyState>=3)return Promise.resolve();return new Promise(resolve=>{const started=performance.now(),events=['canplay','progress','loadeddata','timeupdate'];const check=()=>{if((bufferedAhead(v,t)>=minAhead&&v.readyState>=3)||performance.now()-started>4500){events.forEach(e=>v.removeEventListener(e,check));resolve()}};events.forEach(e=>v.addEventListener(e,check));check()})}
async function prepareCompare(target){const source=$('player'),result=$('resultPlayer'),t=Math.max(0,Number(target)||0);source.pause();result.pause();try{source.currentTime=t;result.currentTime=t}catch(e){}updatePlayback();await Promise.all([waitCanPlay(source),waitCanPlay(result)]);await Promise.all([waitBuffered(source,t),waitBuffered(result,t)]);syncCompare()}
function updatePlayback(){const source=$('player'),duration=Number.isFinite(source.duration)?source.duration:0,ready=bothReady()||!source.paused;$('playRange').value=duration?Math.round(source.currentTime/duration*1000):0;$('playTime').textContent=fmtTime(source.currentTime)+' / '+fmtTime(duration);$('playToggle').disabled=!ready;$('playToggle').textContent=!ready?'加载中…':source.paused?'▶ 播放':'Ⅱ 暂停'}
async function togglePlayback(){const source=$('player'),result=$('resultPlayer');if(source.paused){const target=source.ended?0:source.currentTime;$('playToggle').disabled=true;$('playToggle').textContent='准备播放…';try{await prepareCompare(target);await Promise.all([source.play(),result.src?result.play():Promise.resolve()])}catch(e){$('resultHint').textContent='播放失败：'+e.message}updatePlayback()}else{if(result.src)result.pause();source.pause();updatePlayback()}}
function seekPlayback(value){const source=$('player'),result=$('resultPlayer'),duration=Number.isFinite(source.duration)?source.duration:0;if(duration){source.currentTime=duration*Number(value)/1000;try{result.currentTime=source.currentTime}catch(e){}}updatePlayback()}
function setProcessButton(running,stopping=false){const b=$('processBtn');b.classList.toggle('danger',running||stopping);b.disabled=stopping;b.innerHTML=running||stopping?'<span class="morph-icon">■</span> '+(stopping?'正在停止…':'停止处理'):'<span class="morph-icon">✦</span> 开始处理'}
function updateProgress(s){const p=Number.isFinite(Number(s.progress))?Number(s.progress):null;$('progressBar').style.width=(p===null?0:p)+'%';$('progressText').textContent=p===null?(s.running?'处理中…':'未开始'):(p.toFixed(1)+'%');setProcessButton(s.running,s.phase==='stopping');$('status').textContent=s.status+'\n'+(s.log||[]).slice(-12).join('\n')}
async function openFolder(kind){try{const x=await api('/api/open-folder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind})});$('status').textContent='已打开目录：'+x.path}catch(e){$('status').textContent=e.message;alert(e.message)}}
function loadForm(){for(const k of ['video_dir','engine_root','engine_python','output_dir','style','preset','scale','intensity','detail','codec','cq','bit_depth'])setInput(k,config[k]);updateEngineHelp()}
async function saveConfig(show=true){try{for(const k of ['video_dir','engine_root','engine_python','output_dir'])config[k]=$(k).value;for(const k of ['style','preset','scale','intensity','detail','cq','bit_depth'])config[k]=Number($(k).value);config.codec=$('codec').value;await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});if(show){$('status').textContent='配置已保存';refresh()}}catch(e){if(show)alert(e.message)}}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveConfig(false),500)}function bindAutoSave(){for(const id of ['video_dir','engine_root','engine_python','output_dir','style','preset','scale','intensity','detail','codec','cq','bit_depth'])$(id).addEventListener(['style','preset','scale','codec','bit_depth'].includes(id)?'change':'input',scheduleSave)}
function toggleLibrary(){const main=document.querySelector('main');main.classList.toggle('library-collapsed');document.querySelector('.library-toggle').textContent=main.classList.contains('library-collapsed')?'展开资料库':'收起资料库'}async function toggleProcess(){const s=await api('/api/status');if(s.running)return stopVideo();return processVideo()}async function processVideo(){if(!selected)return;setProcessButton(true);$('status').textContent='正在提交处理任务…';await saveConfig(false);try{await api('/api/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:selected.path})});poll()}catch(e){setProcessButton(false);$('status').textContent='启动失败：'+e.message;alert(e.message)}}async function stopVideo(){setProcessButton(true,true);try{await api('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});poll()}catch(e){$('status').textContent='停止失败：'+e.message}}
async function poll(){try{const s=await api('/api/status');updateProgress(s);if(s.running)setTimeout(poll,700);else{refresh();loadResult()}}catch(e){$('status').textContent='状态读取失败：'+e.message}}
let dragging=false;$('compareRange').addEventListener('input',e=>setCompare(e.target.value));$('playRange').addEventListener('input',e=>seekPlayback(e.target.value));$('divider').addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;dragCompare(e)});window.addEventListener('pointermove',e=>{if(dragging)dragCompare(e)});window.addEventListener('pointerup',()=>{dragging=false});window.addEventListener('pointercancel',()=>{dragging=false});$('player').addEventListener('play',()=>{updatePlayback()});$('player').addEventListener('pause',()=>{$('resultPlayer').pause();updatePlayback()});$('player').addEventListener('ended',()=>{updatePlayback()});$('player').addEventListener('seeking',syncCompare);$('player').addEventListener('loadedmetadata',()=>{updatePlayback();updateVideoBadges()});$('resultPlayer').addEventListener('loadedmetadata',()=>{syncCompare();updatePlayback();updateVideoBadges()});$('player').addEventListener('canplay',updatePlayback);$('resultPlayer').addEventListener('canplay',updatePlayback);$('player').addEventListener('timeupdate',()=>{followCompare();updatePlayback()});
let resumeAfterVisibility=false;document.addEventListener('visibilitychange',()=>{const source=$('player'),result=$('resultPlayer');if(document.hidden){if(!source.paused){resumeAfterVisibility=true;source.pause();if(result.src)result.pause()}}else if(resumeAfterVisibility){resumeAfterVisibility=false;syncCompare();togglePlayback()}});window.addEventListener('error',e=>{$('status').textContent='页面错误：'+e.message});window.addEventListener('unhandledrejection',e=>{$('status').textContent='播放错误：'+(e.reason&&e.reason.message||e.reason||'未知错误')});
function organizeFields(){const fields=document.querySelector('.fields');if(fields&&!fields.querySelector('.directory-fields')){const labels=[...fields.children];const dirs=document.createElement('div'),compact=document.createElement('div');dirs.className='directory-fields';compact.className='compact-fields';labels.forEach((el,i)=>(i<4?dirs:compact).appendChild(el));const settings=document.createElement('details'),summary=document.createElement('summary');settings.className='directory-settings';summary.textContent='目录设置';settings.append(summary,dirs);fields.append(settings,compact)}const panel=document.querySelector('.panel');if(panel&&!panel.querySelector('.run-details')){const statusEl=document.getElementById('status'),progress=document.querySelector('.progress-wrap'),hint=document.querySelector('.hint'),details=document.createElement('details'),summary=document.createElement('summary');details.className='run-details';summary.textContent='运行记录与进度';details.append(summary);[statusEl,progress,hint].forEach(el=>el&&details.append(el));panel.append(details)}}
function ensureBadges(){const compare=$('compare');if(!compare||$('oldBadge'))return;const old=document.createElement('div'),fresh=document.createElement('div');old.id='oldBadge';old.className='video-badge old-badge';fresh.id='newBadge';fresh.className='video-badge new-badge';old.textContent='旧片 / 原片';fresh.textContent='新片 / 增强片';compare.append(old,fresh)}
function updateVideoBadges(){ensureBadges();const source=$('player'),result=$('resultPlayer');if($('oldBadge'))$('oldBadge').textContent='旧片 / 原片 · '+(source.videoWidth?source.videoWidth+'×'+source.videoHeight:'读取中');if($('newBadge'))$('newBadge').textContent='新片 / 增强片 · '+(result.videoWidth?result.videoWidth+'×'+result.videoHeight:'读取中')}
function makeFloatingDraggable(el,handle,key){if(!el||!handle)return;try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&Number.isFinite(saved.left)&&Number.isFinite(saved.top)){el.style.left=Math.max(4,Math.min(innerWidth-46,saved.left))+'px';el.style.top=Math.max(4,Math.min(innerHeight-46,saved.top))+'px';el.style.right='auto';el.style.bottom='auto'}}catch(e){}let sx=0,sy=0,ox=0,oy=0,moved=false;handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;sx=e.clientX;sy=e.clientY;const r=el.getBoundingClientRect();ox=r.left;oy=r.top;moved=false;el.classList.add('floating-dragging');handle.setPointerCapture?.(e.pointerId);e.preventDefault()});handle.addEventListener('pointermove',e=>{if(!el.classList.contains('floating-dragging'))return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;el.style.left=Math.max(4,Math.min(innerWidth-el.offsetWidth-4,ox+dx))+'px';el.style.top=Math.max(4,Math.min(innerHeight-el.offsetHeight-4,oy+dy))+'px';el.style.right='auto';el.style.bottom='auto'});handle.addEventListener('pointerup',e=>{if(!el.classList.contains('floating-dragging'))return;el.classList.remove('floating-dragging');handle.releasePointerCapture?.(e.pointerId);if(moved){localStorage.setItem(key,JSON.stringify({left:parseInt(el.style.left),top:parseInt(el.style.top)}));setTimeout(()=>{moved=false},0)}});handle.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopImmediatePropagation();moved=false}},true)}
organizeFields();ensureBadges();const libraryFloat=document.querySelector('.library-toggle');if(libraryFloat){libraryFloat.style.left='auto';libraryFloat.style.top='14px';libraryFloat.style.right='18px';libraryFloat.style.bottom='auto'}makeFloatingDraggable(libraryFloat,libraryFloat,'comfyops.library.float.v3');const directorySettings=document.querySelector('.directory-settings');if(directorySettings){directorySettings.style.left='auto';directorySettings.style.top='66px';directorySettings.style.right='18px';directorySettings.style.bottom='auto'}makeFloatingDraggable(directorySettings,directorySettings?.querySelector('summary'),'comfyops.directory.float.v3');directorySettings?.addEventListener('toggle',()=>{if(directorySettings.open){const r=directorySettings.getBoundingClientRect(),maxLeft=Math.max(4,innerWidth-r.width-4);if(r.left>maxLeft){directorySettings.style.left=maxLeft+'px';directorySettings.style.right='auto'}}});api('/api/config').then(x=>{config=x;loadForm();bindAutoSave();refresh();poll()});
</script></body></html>
