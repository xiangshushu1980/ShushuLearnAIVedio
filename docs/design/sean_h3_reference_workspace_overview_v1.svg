  <text x="78" y="44" font-size="17" font-weight="700">Reference 工作台</text>
  <rect x="285" y="18" width="126" height="38" rx="10" fill="#1a3037" stroke="#326d6a"/><text x="315" y="42" class="label accent">工作台总览</text>
  <text x="445" y="42" class="label muted">最近活动</text><text x="548" y="42" class="label muted">模板与帮助</text>
  <rect x="1305" y="18" width="260" height="38" rx="10" fill="#17242d" stroke="#33434e"/><circle cx="1328" cy="37" r="6" fill="none" stroke="#9aabb6" stroke-width="1.6"/><path d="m1332 41 5 5" stroke="#9aabb6" stroke-width="1.6"/><text x="1345" y="42" class="small muted">搜索参考实体</text>

  <text x="56" y="125" class="small muted">REFERENCE / 工作台</text>
  <text x="56" y="174" class="title">创建并维护可复用的 Reference</text>
  <text x="56" y="205" font-size="15" class="muted">从设定资料开始，逐步确认概念图、主形象、三视图与声音。生成和审核都在这里完成。</text>
  <rect x="56" y="238" width="1488" height="214" rx="20" fill="url(#hero)" stroke="#315359"/>
  <text x="88" y="282" class="small accent">REFERENCE 创作流程</text>
  <text x="88" y="322" font-size="23" font-weight="700">开始一个新的参考实体</text>
  <text x="88" y="351" class="small muted">先填写实体设定并收集资料；后续步骤可以分次完成，声音也可单独开始。</text>
  <rect x="88" y="382" width="186" height="46" rx="12" fill="#56e2d0"/><text x="119" y="411" font-size="15" font-weight="700" fill="#102027">＋ 创建参考实体</text>
  <text x="300" y="410" class="small muted">已有实体？在下方继续完善或查看已确认资料</text>
  <rect x="1124" y="267" width="384" height="150" rx="15" fill="#101d26" stroke="#32434d"/>
  <text x="1150" y="299" class="label">五个创作面板</text>
  <text x="1150" y="330" class="small muted">01 设定收集　→　02 概念图</text><text x="1150" y="356" class="small muted">03 主形象　　→　04 三视图</text><text x="1150" y="382" class="small muted">05 声音（可并行）</text>

  <text x="56" y="510" class="section">继续处理</text><text x="190" y="510" class="small muted">按最近编辑排序</text>
  <rect x="56" y="535" width="968" height="378" rx="16" class="card"/>
  <rect x="80" y="559" width="78" height="78" rx="12" fill="#304450"/><circle cx="119" cy="589" r="18" fill="#b4c9c5"/><path d="M91 628q28-42 56 0" fill="#476c70"/>
  <text x="180" y="578" font-size="18" font-weight="700">林岚</text><text x="180" y="604" class="small muted">人物 · 最近编辑：今天 09:42</text>
  <rect x="180" y="617" width="106" height="24" rx="12" class="pill"/><text x="194" y="634" class="tiny accent">设定收集中</text>
  <text x="80" y="686" class="label">创作进度</text>
  <rect x="80" y="704" width="870" height="8" rx="4" fill="#263640"/><rect x="80" y="704" width="220" height="8" rx="4" fill="#52d9c9"/>
  <g class="small"><text x="80" y="746" class="accent">● 设定</text><text x="265" y="746" class="muted">○ 概念图</text><text x="450" y="746" class="muted">○ 主形象</text><text x="635" y="746" class="muted">○ 三视图</text><text x="820" y="746" class="muted">○ 声音</text></g>
  <text x="80" y="798" class="small muted">已收集 4 项资料 · 介绍与提示词已保存</text>
  <rect x="80" y="835" width="142" height="42" rx="10" fill="#1c343a" stroke="#376d68"/><text x="109" y="861" class="label accent">继续编辑 →</text>
  <rect x="1044" y="535" width="500" height="378" rx="16" class="card"/>
  <text x="1072" y="574" class="section">创作原则</text>
  <circle cx="1081" cy="618" r="4" fill="#56e2d0"/><text x="1098" y="623" class="small">固定工作流由模板执行，创作时不编辑节点图。</text>
  <circle cx="1081" cy="660" r="4" fill="#56e2d0"/><text x="1098" y="665" class="small">新结果先作为候选，确认后才替换当前版本。</text>
  <circle cx="1081" cy="702" r="4" fill="#56e2d0"/><text x="1098" y="707" class="small">ComfyUI 详情是可选观察入口。</text>
  <circle cx="1081" cy="744" r="4" fill="#56e2d0"/><text x="1098" y="749" class="small">普通媒体浏览仍由 comfyui-browser 负责。</text>
  <path d="M1072 780h444" class="line"/><text x="1072" y="814" class="small muted">工作台管理 Reference 的创建、确认与版本状态。</text><text x="1072" y="839" class="small muted">不提供通用素材库、角色库或工作流导航。</text>
  <text x="56" y="964" class="tiny muted">Owner: Sean · 概念设计稿 v1 · 产品名称待定</text>
