      text{font-family:Inter,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#e8f0f3}.muted{fill:#9aabb6}.small{font-size:13px}.tiny{font-size:11px}.title{font-size:27px;font-weight:700}.section{font-size:18px;font-weight:650}.label{font-size:14px;font-weight:600}.accent{fill:#59e2d0}.line{stroke:#2c3b46;stroke-width:1}.card{fill:#131f29;stroke:#2b3b47}.pill{fill:#1b3037;stroke:#2d6261}.chip{fill:#1e2a34;stroke:#374651}
